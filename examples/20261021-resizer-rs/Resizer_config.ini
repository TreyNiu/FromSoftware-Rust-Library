; Configuration for resizer-rs.
; Changes are hot-reloaded while the game is running.

[settings]

; Player size multiplier. 50% = half size, 200% = double size.
playerScale = 100%

; Camera distance multiplier. Use 'player' to follow playerScale.
cameraScale = player

; Equipped weapon size and direct attack hitbox multiplier.
; 'auto' uses max(playerScale, 100%).
weaponScale = player

; Torrent size multiplier. Use 'player' to follow playerScale.
torrentScale = player

; Mimic Tear size multiplier.
mimicScale = player

; Other spirit summon size multiplier.
summonScale = player

; Root-motion multiplier is pow(scale, movementInfluence).
movementInfluence = 100%

; true / false / auto. 'auto' enables at playerScale >= 200%.
noFallDamage = auto

; true = disable cloth physics, matching the original Resizer workaround.
; false = keep native cloth running and scale the bones that drive the garment.
; Start with moderate scale values when using false; this is a partial cloth solution.
disableClothPhysics = false

; Diagnostic switches. Hook changes require restarting the game.
enableCharacterScaling = true
enableParamScaling = true
enableCameraHook = true
enableWeaponHook = true

; Rust extension: scale Havok bone lengths and thickness.
scaleBones = true
