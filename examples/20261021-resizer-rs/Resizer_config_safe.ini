; Safe diagnostic configuration for resizer-rs.
; Use this first to verify that the DLL can load and the tick task runs without touching hooks,
; parameters, characters, or Havok skeletons. Then enable one feature at a time.

[settings]

playerScale = 100%
cameraScale = player
weaponScale = player
torrentScale = player
mimicScale = player
summonScale = player

movementInfluence = 100%
noFallDamage = auto

disableClothPhysics = false
enableCharacterScaling = false
enableParamScaling = false
enableCameraHook = false
enableWeaponHook = false
scaleBones = false
